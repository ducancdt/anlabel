name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ANLAbel.slnx

      - name: Build
        run: dotnet build ANLAbel.slnx -c Release --no-restore

      - name: Run application regression tests
        run: dotnet run --project src/ANLAbel.Tests/ANLAbel.Tests.csproj -c Release --no-build

      - name: Run unit tests
        run: dotnet test src/ANLAbel.UnitTests/ANLAbel.UnitTests.csproj -c Release --no-build --logger "console;verbosity=normal"
